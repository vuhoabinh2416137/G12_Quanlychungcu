spring.application.name=G12_Quanlychungcu
logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}

# Thong tin ket noi Database
spring.datasource.url=jdbc:mysql://localhost:3307/bluemoon
spring.datasource.username=bluemoon
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cau hinh JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

jwt.secret=bluemoon-secret-key-for-dev-environment-please-change-2026
jwt.expiration-ms=86400000
