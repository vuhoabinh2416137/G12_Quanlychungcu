services:
  db:
    image: mysql:8.0
    container_name: bluemoon
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bluemoon
      MYSQL_USER: bluemoon
      MYSQL_PASSWORD: password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: