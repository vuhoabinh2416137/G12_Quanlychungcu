version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: bluemoon-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bluemoon
      MYSQL_USER: bluemoon
      MYSQL_PASSWORD: password
    ports:
      - "3306:3307"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: bluemoon-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - bluemoon-network

  frontend:
    build: ./frontend
    container_name: bluemoon-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - bluemoon-network

volumes:
  mysql_data:

networks:
  bluemoon-network:
    driver: bridge
